<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Hozo</title>
  <!-- A square with a dovetail socket cut from its top and its bottom: what is left is an H.
       Sumi in a light browser, shikkui in a dark one, so the tile always stands off the tab. -->
  <style>
    .tile { fill: #141312 }
    .mark { fill: #f7f5f0 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f7f5f0 }
      .mark { fill: #141312 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <path class="mark" d="M6 6H13.4L11.4 13H20.6L18.6 6H26V26H18.6L20.6 19H11.4L13.4 26H6Z"/>
</svg>
