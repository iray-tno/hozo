<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" fill="none">
  <!-- Subtle organic heartwood warmth -->
  <radialGradient id="heartwood" cx="320" cy="150" r="280" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#c8a882" stop-opacity="0.18" />
    <stop offset="50%" stop-color="#a8855e" stop-opacity="0.08" />
    <stop offset="100%" stop-color="#c8a882" stop-opacity="0" />
  </radialGradient>
  <rect width="600" height="300" fill="url(#heartwood)" />

  <!-- Fine longitudinal wood fibers (木理) -->
  <g stroke="#c8a882" opacity="0.16" stroke-linecap="round">
    <line x1="0" y1="8" x2="600" y2="9" stroke-width="0.6" stroke-dasharray="80 8 40 5" />
    <line x1="0" y1="24" x2="600" y2="23" stroke-width="0.7" stroke-dasharray="120 12 60 8" />
    <line x1="0" y1="42" x2="600" y2="44" stroke-width="0.5" stroke-dasharray="50 10 90 6" />
    <line x1="0" y1="64" x2="600" y2="62" stroke-width="0.6" stroke-dasharray="100 15 70 10" />
    <line x1="0" y1="86" x2="600" y2="88" stroke-width="0.7" stroke-dasharray="60 8 110 12" />
    <line x1="0" y1="112" x2="600" y2="110" stroke-width="0.6" stroke-dasharray="140 10 40 8" />
    <line x1="0" y1="136" x2="600" y2="138" stroke-width="0.5" stroke-dasharray="70 6 80 14" />
    <line x1="0" y1="162" x2="600" y2="160" stroke-width="0.7" stroke-dasharray="90 12 50 6" />
    <line x1="0" y1="188" x2="600" y2="190" stroke-width="0.6" stroke-dasharray="110 8 70 10" />
    <line x1="0" y1="214" x2="600" y2="212" stroke-width="0.5" stroke-dasharray="60 14 100 8" />
    <line x1="0" y1="238" x2="600" y2="240" stroke-width="0.7" stroke-dasharray="130 10 45 6" />
    <line x1="0" y1="262" x2="600" y2="260" stroke-width="0.6" stroke-dasharray="80 8 90 12" />
    <line x1="0" y1="284" x2="600" y2="286" stroke-width="0.5" stroke-dasharray="100 6 60 8" />
  </g>

  <!-- Curving annual growth rings & timber knots (板目・玉杢の年輪) -->
  <g fill="none" stroke="#c8a882" stroke-linecap="round">
    <path d="M0,15 Q150,22 300,14 T600,18" stroke-width="1.2" opacity="0.32" />
    <path d="M0,36 Q180,26 360,42 T600,32" stroke-width="1.0" opacity="0.28" />
    <path d="M0,58 Q140,68 310,52 T600,62" stroke-width="1.4" opacity="0.36" />
    <path d="M0,82 Q120,96 230,86 Q310,78 400,90 Q490,102 600,84" stroke-width="1.5" opacity="0.42" />
    <path d="M0,108 Q140,122 250,110 Q320,102 390,114 Q480,128 600,106" stroke-width="1.3" opacity="0.45" />

    <!-- Central timber knot & annual rings (玉杢・年輪の芯) -->
    <ellipse cx="320" cy="150" rx="95" ry="26" stroke-width="1.8" opacity="0.50" />
    <ellipse cx="320" cy="150" rx="155" ry="42" stroke-width="1.5" opacity="0.42" />
    <ellipse cx="320" cy="150" rx="215" ry="58" stroke-width="1.3" opacity="0.36" />
    <ellipse cx="320" cy="150" rx="275" ry="74" stroke-width="1.1" opacity="0.30" />

    <path d="M0,194 Q130,178 245,190 Q320,198 395,186 Q490,174 600,196" stroke-width="1.3" opacity="0.45" />
    <path d="M0,220 Q150,208 280,224 Q360,232 460,216 Q530,208 600,222" stroke-width="1.5" opacity="0.40" />
    <path d="M0,246 Q160,256 330,240 T600,250" stroke-width="1.1" opacity="0.34" />
    <path d="M0,272 Q200,260 380,278 T600,268" stroke-width="1.3" opacity="0.30" />
    <path d="M0,292 Q170,300 350,288 T600,294" stroke-width="0.9" opacity="0.25" />
  </g>
</svg>