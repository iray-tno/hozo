packages:
  - "packages/*"
  - "examples/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  # Denied on purpose: its install script downloads an ffmpeg binary that only
  # the Windows screen reader recording needs. screen-readers.yml runs it there.
  ffmpeg-static: false
  sharp: true
overrides:
  # GHSA-8r5x-fm3f-whwj and its sibling: two critical injections in
  # Handlebars' compiler, patched in 4.7.10. It reaches the tree only through
  # `@hozo/test-reporter` > allure, which pins no newer one yet; remove this
  # once allure's own range moves past 4.7.9.
  handlebars: '>=4.7.10'
  # GHSA-2883-xcg3-v3hh (high), patched in 4.3.2. Pinned at 4.3.1 by part of
  # the landing site's Astro tree; a patch release, so the same API. Remove
  # once nothing in the tree pins below 4.3.2.
  js-yaml@4: '>=4.3.2 <5'
  # GHSA-vc2v-76pw-4v95 (high), patched in 1.8.2. Pinned at 1.8.1 through the
  # Expo demo's dev server. Remove once Expo's range moves past it.
  compression@1: '>=1.8.2 <2'
  # Security patches for the workspace's Next/Vite fixtures. Keep the
  # existing major/minor lines; remove once their manifests require these
  # fixes (GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr, GHSA-p3m5-59mp-jv5r
  # and GHSA-587h-7wmj-h5pm).
  next@16: '16.4.1'
  vite@8: '8.2.4'
  # Storybook is also an auto-installed peer of the published preset.
  # Match the patched Web/Native fixtures until all peer resolutions agree.
  # GHSA-f2ph-cmg5-wxc8 and GHSA-px85-f4q5-jh77.
  storybook@10: '10.6.3'
  # Native's caret ranges otherwise pull the 10.7 UI alongside its 10.6
  # host. Keep this security update on the existing Native minor line.
  '@storybook/react-native-ui@10': '10.6.2'
  '@storybook/react-native-ui-common@10': '10.6.2'
  '@storybook/react-native-theming@10': '10.6.2'
  # The report generator and dev servers still resolve vulnerable transitive
  # versions. These patches retain their existing APIs. Remove when their
  # upstream dependency ranges exclude the vulnerable releases.
  # GHSA-gfr2-rv44-r23c / GHSA-r7fv-28h4-cvq7.
  markdown-it@14: '14.3.3'
  # GHSA-cg2g-xh64-v4q7 / GHSA-mrv2-3pqr-j5jr.
  dompurify@3: '3.4.17'
  # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c.
  follow-redirects@1: '1.16.1'
  # GHSA-587h-7wmj-h5pm.
  launch-editor@2: '2.14.2'
  # GHSA-27r3-jxmh-p828 (Native CLI server) and GHSA-xjj6-f33q-929c
  # (Astro's font resolver). Remove when their parents require these fixes.
  body-parser@2: '2.4.0'
  undici@8: '8.12.2'
  # GHSA-mrhx-c7xc-m3w5 has no Zod 3 patch. Astro already uses Zod 4;
  # Expo CLI is the only Zod 3 consumer. Its plugin/output/MCP schemas are
  # checked against Zod 4 in native-showcase's dependency compatibility test.
  # Remove the scoped override once Expo CLI declares a patched Zod itself.
  zod@4: '4.6.6'
  '@expo/cli>zod': '4.6.6'
# High and above fail `pnpm audit` here and in CI (#934). These are the
# findings with no patched release, accepted one by one rather than by a
# lower threshold. Each says where it reaches the tree and when it goes.
auditConfig:
  ignoreGhsas:
    # braces, deeply nested patterns can exhaust the stack. No release after
    # 3.0.3. No longer through `@hozo/compiler`, which dropped globby for
    # tinyglobby (#946). It still reaches the workspace through React
    # Native's own toolchain -- the community CLI and Metro, via fast-glob
    # and micromatch -- which a React Native app installs whatever Hozo does.
    # Remove when a patch ships or that toolchain moves off micromatch.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge. No release after 1.4.0, and the newest @expo/cli (57.0.30)
    # still asks for ^1.3.3, so moving Expo does not drop it. Development
    # only: the Expo demo's CLI (`examples/expo-router-demo`). Remove when a
    # patch ships or Expo stops depending on it.
    - GHSA-86w9-cpqp-85rv
