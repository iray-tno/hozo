packages:
  - "packages/*"
  - "examples/*"
# Optional platform peers must stay optional in the development workspace as
# well. Otherwise adding @hozo/canvas makes a Web-only install download every
# Skia native binary merely to satisfy an optional peer.
autoInstallPeers: false
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@storybook/builder-vite@10.5.9'
  - '@storybook/csf-plugin@10.5.9'
  - '@storybook/react-dom-shim@10.5.9'
  - '@storybook/react-vite@10.5.9'
  - '@storybook/react@10.5.9'
  - storybook@10.5.9
