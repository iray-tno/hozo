name: disabled-navigation-measure
on:
  push:
    branches: [chore/disabled-navigation-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native:release
      - run: pnpm exec turbo run build --filter='@hozo/tailwind-conformance...' --concurrency=2
      - name: Record source
        run: |
          mkdir -p artifacts/disabled-navigation
          git rev-parse HEAD > artifacts/disabled-navigation/source-commit.txt
      - name: Measure actual browser activation and Tab order
        run: pnpm --filter @hozo/example-storybook exec node --test --test-concurrency=1 --test-name-pattern='disabled navigation keeps|disabled destination|authored tabIndex|Button without a destination' scripts/candidate-cascade.test.mjs scripts/disabled-link.test.mjs > artifacts/disabled-navigation/browser.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disabled-navigation-browser-evidence
          path: artifacts/disabled-navigation
      - name: Generate an unvalidated conformance snapshot
        if: always()
        run: env -u CI pnpm --filter @hozo/tailwind-conformance report > artifacts/disabled-navigation/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disabled-navigation-evidence
          path: |
            artifacts/disabled-navigation
            packages/tailwind-conformance/snapshot.json
