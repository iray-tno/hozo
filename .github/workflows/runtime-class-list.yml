# Informational, serial historical measurements. No runner-clock threshold
# in the normal PR gate, no browser/device, and raw evidence is always kept.
name: runtime-class-list

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Optional post-888 source ref to compare the current optimization against'
        type: string
        required: false
        default: ''
      cpu-profile:
        description: 'Capture CPU profiles for diagnosis (timings include profiler overhead)'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - '.github/workflows/runtime-class-list.yml'
      - 'scripts/runtime-class-list*'

permissions:
  contents: read

concurrency:
  group: runtime-class-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: cc1914bf49aaddd642d850bed77cb503e3e9966d
          path: .benchmark-before
      - uses: actions/checkout@v4
        with:
          ref: 6333a72ba5720fc3b25f4eeab0bbd66b5bf131b4
          path: .benchmark-after
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.baseline != ''
        with:
          ref: ${{ inputs.baseline }}
          path: .benchmark-baseline
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      # All three source revisions use this one pinned dependency install.
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - name: Measure revisions sequentially
        env:
          BASELINE_REF: ${{ inputs.baseline }}
          CPU_PROFILE: ${{ inputs.cpu-profile }}
        shell: bash
        run: |
          mkdir -p artifacts/runtime-class-list target
          variants='before after current'
          if [ -n "$BASELINE_REF" ]; then variants='before after baseline current'; fi
          for variant in $variants; do
            source="$GITHUB_WORKSPACE"
            if [ "$variant" != current ]; then
              source="$GITHUB_WORKSPACE/.benchmark-$variant"
              ln -s "$GITHUB_WORKSPACE/target" "$source/target"
            fi
            # These checkouts have the same package IDs and older mtimes
            # than the first build. Cargo can otherwise reuse that binary
            # despite different source contents. Retain third-party caches,
            # but force every Hozo compiler crate to rebuild for this source.
            cargo clean --manifest-path "$source/Cargo.toml" -p hozo_ir -p hozo_parser -p hozo_native -p hozo_web -p hozo_cache -p hozo_napi > "artifacts/runtime-class-list/$variant-clean.log" 2>&1
            node "$source/packages/compiler/scripts/build-native.mjs" > "artifacts/runtime-class-list/$variant-build.log" 2>&1
            profile_flags=()
            if [ "$CPU_PROFILE" = true ]; then
              profile_flags=(--cpu-prof --cpu-prof-name="$variant.cpuprofile" --cpu-prof-dir="$GITHUB_WORKSPACE/artifacts/runtime-class-list")
            fi
            node "${profile_flags[@]}" scripts/runtime-class-list.mjs --root "$source" --output "artifacts/runtime-class-list/$variant.json" > "artifacts/runtime-class-list/$variant.log" 2>&1
          done
      - name: Verify evidence and publish the comparison
        env:
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASELINE_REF: ${{ inputs.baseline }}
        run: |
          baseline_sha=''
          if [ -n "$BASELINE_REF" ]; then baseline_sha=$(git -C .benchmark-baseline rev-parse HEAD); fi
          node scripts/runtime-class-list-report.mjs artifacts/runtime-class-list "$CURRENT_SHA" "$baseline_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-class-list-evidence
          path: artifacts/runtime-class-list
          if-no-files-found: error
