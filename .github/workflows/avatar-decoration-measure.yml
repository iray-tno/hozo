name: avatar-decoration-measure
on:
  push:
    branches: [chore/avatar-decoration-measure]
permissions:
  contents: read
jobs:
  browser-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm exec turbo run build --filter=@hozo/compiler... --filter=@hozo/primitives... --filter=@hozo/form... --filter=@hozo/patterns... --concurrency=1
      - name: Compare Avatar decorations and independent Tailwind
        shell: bash
        run: |
          mkdir -p artifacts/avatar-decorations
          git rev-parse HEAD > artifacts/avatar-decorations/source.txt
          git rev-parse HEAD^ > artifacts/avatar-decorations/feature-source.txt
          node --test --test-concurrency=1 --test-name-pattern='Avatar decorative owners|CommandPalette decorative owners|AOT Chip root disabled|decorative Stepper and Pagination owners|root capture scopes|ordered secondary guards|mixed secondary AOT|mixed Chip root keeps|OTP semantic classes|OTP focus belongs|CommandPalette semantic classes|CommandPalette shortcuts remain|ColorPicker semantic classes|Stepper semantic classes|Chip semantic classes|Pagination semantic classes|second batch of Native controls|Native slotted patterns' examples/storybook-demo/scripts/candidate-cascade.test.mjs 2>&1 | tee artifacts/avatar-decorations/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-decorations
          path: artifacts/avatar-decorations/
          if-no-files-found: warn
