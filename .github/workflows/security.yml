name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'Cargo.lock'
      - '.npmrc'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'Cargo.lock'
      - '.npmrc'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Run pnpm audit with retry
        run: |
          for i in {1..3}; do
            echo "Attempt $i to run pnpm audit..."
            if pnpm audit --audit-level=critical --fetch-timeout=30000 --fetch-retries=3; then
              echo "pnpm audit succeeded."
              exit 0
            fi
            echo "pnpm audit failed on attempt $i. Waiting before retry..."
            sleep 10
          done
          echo "pnpm audit failed after 3 attempts."
          exit 1

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
