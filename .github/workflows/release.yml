# Publishes everything: every published `@hozo/*` package, plus one package per
# platform carrying the native binding. Every registry operation authenticates
# through the trust configured for this workflow; no long-lived publishing
# credential is part of the normal release path.
#
# Triggered by a tag, and only by a tag. `version.yml` keeps a "Version
# Packages" pull request open; merging it bumps every version and writes
# every changelog on `main` but publishes nothing. Pushing `v0.2.0` is the
# separate, deliberate act that uploads. npm allows unpublishing for 72
# hours and only while nothing depends on the package, so the step worth
# making explicit is this one.
#
# The shape is napi-rs's, without its CLI: a package per platform declaring
# `os`/`cpu`/`libc`, all of them optional dependencies of the real package,
# so npm installs the single one this machine can run and skips the rest.
# `packages/compiler/src/native-targets.ts` is the list, and a test in that
# package checks it against what the runtime loader asks for -- the two are
# independent derivations of one fact and a disagreement only shows up on
# the platform nobody develops on.
#
# The build half has been run, as a `workflow_dispatch` dry run: six of the
# eight targets passed first time and both musl ones failed, for one reason
# (see `RUSTFLAGS` below). The `publish` job has still never executed --
# `workflow_dispatch` stops before it by design, and the first time it runs
# will be the tag that publishes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - triple: x86_64-apple-darwin
            runner: macos-latest
          - triple: aarch64-apple-darwin
            runner: macos-latest
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}
      # musl needs a linker the GNU-hosted runners do not carry.
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: node scripts/pack-native.mjs --target ${{ matrix.triple }}
        working-directory: packages/compiler
        env:
          # Rust's musl targets link the C runtime statically by default,
          # and a statically linked target cannot produce a cdylib at all --
          # `cargo build` refuses with "does not support these crate types"
          # rather than failing at link time. Node loads the addon as a
          # shared object, so the static default is the wrong one here and
          # turning it off is what every napi-rs project does for musl.
          #
          # Found by running this workflow. The note at the top of this file
          # guessed the musl and cross-arch jobs would be where it broke:
          # half right, since both cross-arch jobs passed and both musl ones
          # failed for this single reason.
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: artifacts/
          if-no-files-found: error

  # Tags only. `workflow_dispatch` runs `build` and stops, which is the
  # dry run this workflow needed: eight targets, of which this repository
  # has only ever built one, and the note at the top of this file says the
  # musl and cross-arch jobs are where it will break. Finding that out by
  # pushing a tag is the expensive way -- npm allows unpublishing for 72
  # hours and only while nothing depends on the package.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing, and the provenance attestation either way.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trusted Publishing requires npm >=11.5.1. Node 25 currently carries a
      # newer CLI; keeping the assertion here makes a future runner change fail
      # before it reaches the first irreversible upload.
      - run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)) process.exit(1)"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Fails if any of the eight is missing, rather than publishing a
      # `@hozo/compiler` whose optional dependency does not exist -- which
      # installs cleanly and then cannot load on that platform.
      - run: node scripts/check-artifacts.mjs
        working-directory: packages/compiler

      # The packages ship compiled JavaScript and declarations, and
      # `dist/` is not in the repository. Publishing without this step
      # produces packages that install cleanly and import nothing.
      # Packages only: the examples' builds want the native addon, and
      # nothing here needs them.
      - run: pnpm turbo run build --filter='./packages/*'

      # Looks inside the tarballs rather than at the manifests describing
      # them: every entry point present, no tests, no addon, a README and
      # a LICENSE in each, and all of them on one version. Runs before
      # `prepare-publish`, which is allowed to rewrite one of them.
      - run: node scripts/check-packages.mjs

      - run: |
          for dir in artifacts/*/; do
            npm publish "$dir" --access public --provenance
          done

      # Writes the optional-dependency list, which is generated rather
      # than committed -- see scripts/prepare-publish.mjs.
      - run: node scripts/prepare-publish.mjs
        working-directory: packages/compiler

      # pnpm turns every `workspace:^` dependency into the real semver range
      # while packing. npm then uploads those immutable tarballs itself: OIDC
      # authentication is an npm CLI feature, so the upload deliberately goes
      # through npm itself.
      - run: node scripts/pack-npm.mjs
      - run: |
          while read -r tarball; do
            npm publish "$tarball" --access public --provenance
          done < artifacts/npm/order.txt

  # The library crates, from the same tag and on the same version --
  # `scripts/crate-metadata.mjs` holds the workspace to the npm version, and
  # `check-packages.mjs` fails a release where they differ.
  #
  # After the npm packages rather than beside them: crates.io has no
  # unpublish at all, only yank, so it goes last, once everything that can
  # still fail has had its chance. `cargo publish --workspace` publishes in
  # dependency order and skips the `publish = false` bindings.
  #
  # A token for the same reason as npm's above: crates.io creates a trusted
  # publisher configuration "only after an initial manual publishing of a
  # crate" (RFC 3691). After the first release, configure one per crate and
  # replace this step's token with `rust-lang/crates-io-auth-action`.
  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Cargo reads the temporary credential from its normal local store. The
      # action revokes it in its post step when this ephemeral runner exits.
      - run: cargo login "${{ steps.auth.outputs.token }}"
      - run: cargo publish --workspace

  # The dry run for the above, on `workflow_dispatch`: packages every crate
  # and builds each from its packaged sources alone, which is where a missing
  # `version` on a path dependency or a file outside the package shows up.
  # The npm half is packed too, through the same pnpm-to-npm handoff as a real
  # release. The eight platform packages the build produced are checked with
  # the same `check-artifacts.mjs` the publish job runs, but where a failure
  # costs a re-run instead of a deleted tag. The first `v0.1.0` built all
  # eight, and npm refused the first upload because none of them named its
  # repository; a dispatch run had passed, because nothing looked at the
  # manifests until publishing.
  artifacts-dry-run:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: node scripts/check-artifacts.mjs
        working-directory: packages/compiler
      - run: pnpm turbo run build --filter='./packages/*'
      - run: node scripts/check-packages.mjs
      - run: node scripts/prepare-publish.mjs
        working-directory: packages/compiler
      - run: node scripts/pack-npm.mjs

  crates-dry-run:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run
