name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'examples/storybook-demo/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'turbo.json'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  # A release published using GITHUB_TOKEN cannot trigger a `release` event
  # workflow. Observe the successful tag workflow instead; dry runs don't deploy.
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  # Reads native-showcase's screenshot artifact for the docs pages and
  # workflow run history for the Allure verification report.
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      reports_passed: ${{ steps.check-junit.outcome == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # The sitemap dates each page by its source's last commit, which
          # needs the history; a shallow clone leaves every <lastmod> out.
          # Commits and trees only: no old file contents are downloaded.
          fetch-depth: 0
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native
      # The REPL page fetches this. Without it the page still deploys and
      # says the compiler is missing, which is worse than a slower deploy.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -oP '^wasm-bindgen = "=\K[0-9.]+' crates/hozo_wasm/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: node scripts/build-wasm.mjs
      - run: pnpm build
      # The docs component pages show each demo as the last Android run on
      # main captured it. Failing to fetch leaves them out, never the deploy.
      - run: node apps/landing/scripts/fetch-native-screenshots.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --filter @hozo/landing build
        env:
          HOZO_SHOWCASE_DOWNLOADS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --filter @hozo/example-storybook build

      - name: Integrate Storybook into Landing Dist
        run: |
          mkdir -p apps/landing/dist/storybook
          cp -r examples/storybook-demo/storybook-static/* apps/landing/dist/storybook/

      # Before the deploy, the live sitemap is still the previous one, so this
      # is the moment to list the pages the deploy changes. Never fails.
      - name: List changed pages for search engines
        run: >-
          node apps/landing/scripts/notify-search-engines.mjs prepare
          --built apps/landing/dist/sitemap.xml
          --live https://iray-tno.github.io/hozo/sitemap.xml
          --out search-notify
      - uses: actions/upload-artifact@v6
        with:
          name: search-notify
          path: search-notify/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report (Rust nextest)
        run: |
          mkdir -p junit-reports
          if node packages/test-reporter/src/run-command-junit.mjs nextest cargo nextest run --workspace --profile ci && [ -f target/nextest/ci/nextest.xml ]; then
            rm -f junit-reports/slow-nextest.xml
          fi
          if [ -f target/nextest/ci/nextest.xml ]; then
            cp target/nextest/ci/nextest.xml junit-reports/nextest.xml
            node packages/test-reporter/src/normalize-junit.mjs rust junit-reports/nextest.xml || true
          fi

      - name: Report (Clippy)
        run: cargo clippy --message-format=json 2>/dev/null | node packages/test-reporter/src/clippy-to-junit.mjs > junit-reports/clippy.xml || true

      - name: Report (Biome)
        run: pnpm exec biome check --reporter=json . 2>/dev/null | node packages/test-reporter/src/biome-to-junit.mjs > junit-reports/biome.xml || true

      - name: Report (TypeScript & Unit tests)
        # A discovery/runner crash must also leave a failed suite, even if it
        # happens before the per-package reports can be written.
        run: |
          node packages/test-reporter/src/run-command-junit.mjs node-tests node packages/test-reporter/src/run-tests-junit.mjs || true
          if [ -f junit-reports/node-summary.xml ]; then
            rm -f junit-reports/slow-node-tests.xml
          fi

      - name: Report (real app integration builds)
        # Several app exports/Next builds otherwise compete with Metro's own
        # workers. Keep the same checks/deadlines, with two app tasks at once.
        run: node packages/test-reporter/src/run-command-junit.mjs integration pnpm test:integration --concurrency=2 --continue --summarize || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-export-evidence
          path: examples/native-showcase/artifacts/bundle-exports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: storybook-a11y-evidence
          path: |
            examples/storybook-demo/storybook-static-check/_a11y-result.json
            examples/storybook-demo/storybook-static-check/_appearance-result.json
          if-no-files-found: warn

      - name: Report (performance tripwires)
        run: node packages/test-reporter/src/run-command-junit.mjs performance pnpm test:performance --summarize || true

      - name: Report (full differential conformance)
        run: |
          pnpm --filter @hozo/compiler build:native:release
          node packages/test-reporter/src/run-command-junit.mjs conformance pnpm turbo run report --summarize -- --check || true

      - name: Report (optional & cross-platform CI workflows)
        run: node packages/test-reporter/src/workflows-to-junit.mjs || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch previous Allure history
        run: |
          mkdir -p allure-history
          curl -fsSL https://iray-tno.github.io/hozo/reports/history/allure-history.jsonl -o allure-history/allure-history.jsonl || rm -f allure-history/allure-history.jsonl

      - name: Add source links to Allure results
        run: node packages/test-reporter/src/junit-to-allure.mjs

      - name: Build Allure HTML reports
        run: pnpm --filter @hozo/test-reporter exec allure generate --cwd "$GITHUB_WORKSPACE" -o "$GITHUB_WORKSPACE/apps/landing/dist/reports" "$GITHUB_WORKSPACE/allure-results" || true

      - name: Persist Allure history
        run: |
          mkdir -p apps/landing/dist/reports/history
          cp -f allure-history/allure-history.jsonl apps/landing/dist/reports/history/allure-history.jsonl || true

      - name: Brand Allure report head
        run: node packages/test-reporter/src/brand-report.mjs apps/landing/dist/reports/index.html || true

      - name: Ensure .nojekyll exists
        run: touch apps/landing/dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # v4+ leaves dotfiles out by default; .nojekyll was always shipped.
          include-hidden-files: true
          path: apps/landing/dist

      # Record whether any reported suite failed without blocking `deploy`
      # from publishing the diagnostic Allure report. Every producer above
      # writes JUnit even when its command fails, and `assert-reports` turns
      # a recorded failure into a failed workflow check in parallel.
      - name: Check reported checks
        id: check-junit
        continue-on-error: true
        run: node packages/test-reporter/src/assert-junit.mjs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      # Separate from `build` so runner startup gives GitHub's artifact
      # index time to catch up after upload finalization and a transient
      # deploy failure can be rerun without uploading a duplicate
      # `github-pages` artifact (actions/deploy-pages#451, #338).
      # Retry only when deploy-pages failed before creating a deployment
      # (empty `page_url`), covering longer artifact-listing tails without
      # risking duplicate Pages deployment requests.
      - name: Deploy to GitHub Pages
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for Pages artifact visibility before retry 1
        if: steps.deploy_1.outcome == 'failure' && !steps.deploy_1.outputs.page_url
        run: sleep 15

      - name: Deploy to GitHub Pages (retry 1)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure' && !steps.deploy_1.outputs.page_url
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for Pages artifact visibility before retry 2
        if: steps.deploy_2.outcome == 'failure' && !steps.deploy_2.outputs.page_url
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy_3
        if: steps.deploy_2.outcome == 'failure' && !steps.deploy_2.outputs.page_url
        uses: actions/deploy-pages@v5

      - name: Fail if Pages deployment did not succeed
        if: steps.deploy_1.outcome != 'success' && steps.deploy_2.outcome != 'success' && steps.deploy_3.outcome != 'success'
        run: |
          echo "GitHub Pages deployment did not succeed." >&2
          exit 1

  assert-reports:
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.reports_passed != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert reported checks passed
        run: |
          echo "Reported checks failed in the build job; see the 'Check reported checks' step and the deployed Allure report." >&2
          exit 1

  # Sends the pages this deploy changed to IndexNow and, once configured, to
  # Google's Indexing API (docs/search-engine-notifications.md). After a real
  # deploy of main only: the workflow has no pull_request trigger, and the ref
  # check stops a dispatch from another branch. Its failure never fails the run.
  notify-search-engines:
    needs: [build, deploy]
    if: ${{ needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only for Google's short-lived token. The Google side accepts it only
      # for this repository's main branch.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: apps/landing
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: search-notify
          path: search-notify
      - name: Authenticate to Google (keyless)
        id: google
        if: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GOOGLE_INDEXING_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        # v3.0.0, pinned by commit because this step holds an OIDC token.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Notify search engines
        continue-on-error: true
        run: node apps/landing/scripts/notify-search-engines.mjs submit --changes search-notify/changes.json
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
