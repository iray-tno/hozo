name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'examples/storybook-demo/**'
      - 'packages/**'
      - 'crates/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'turbo.json'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  # A release published using GITHUB_TOKEN cannot trigger a `release` event
  # workflow. Observe the successful tag workflow instead; dry runs don't deploy.
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  # Reads native-showcase's screenshot artifact for the docs pages and
  # workflow run history for the Allure verification report.
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native
      # The REPL page fetches this. Without it the page still deploys and
      # says the compiler is missing, which is worse than a slower deploy.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -oP '^wasm-bindgen = "=\K[0-9.]+' crates/hozo_wasm/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: node scripts/build-wasm.mjs
      - run: pnpm build
      # The docs component pages show each demo as the last Android run on
      # main captured it. Failing to fetch leaves them out, never the deploy.
      - run: node apps/landing/scripts/fetch-native-screenshots.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --filter @hozo/landing build
        env:
          HOZO_SHOWCASE_DOWNLOADS: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --filter @hozo/example-storybook build

      - name: Integrate Storybook into Landing Dist
        run: |
          mkdir -p apps/landing/dist/storybook
          cp -r examples/storybook-demo/storybook-static/* apps/landing/dist/storybook/

      - name: Report (Rust nextest)
        run: |
          mkdir -p junit-reports
          if node packages/test-reporter/src/run-command-junit.mjs nextest cargo nextest run --workspace --profile ci && [ -f target/nextest/ci/nextest.xml ]; then
            rm -f junit-reports/slow-nextest.xml
          fi
          if [ -f target/nextest/ci/nextest.xml ]; then
            cp target/nextest/ci/nextest.xml junit-reports/nextest.xml
            node packages/test-reporter/src/normalize-junit.mjs rust junit-reports/nextest.xml || true
          fi

      - name: Report (Clippy)
        run: cargo clippy --message-format=json 2>/dev/null | node packages/test-reporter/src/clippy-to-junit.mjs > junit-reports/clippy.xml || true

      - name: Report (Biome)
        run: pnpm exec biome check --reporter=json . 2>/dev/null | node packages/test-reporter/src/biome-to-junit.mjs > junit-reports/biome.xml || true

      - name: Report (TypeScript & Unit tests)
        # A discovery/runner crash must also leave a failed suite, even if it
        # happens before the per-package reports can be written.
        run: |
          node packages/test-reporter/src/run-command-junit.mjs node-tests node packages/test-reporter/src/run-tests-junit.mjs || true
          if [ -f junit-reports/node-summary.xml ]; then
            rm -f junit-reports/slow-node-tests.xml
          fi

      - name: Report (real app integration builds)
        # Several app exports/Next builds otherwise compete with Metro's own
        # workers. Keep the same checks/deadlines, with two app tasks at once.
        run: node packages/test-reporter/src/run-command-junit.mjs integration pnpm test:integration --concurrency=2 --continue --summarize || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-export-evidence
          path: examples/native-showcase/artifacts/bundle-exports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-a11y-evidence
          path: examples/storybook-demo/storybook-static-check/_a11y-result.json
          if-no-files-found: warn

      - name: Report (performance tripwires)
        run: node packages/test-reporter/src/run-command-junit.mjs performance pnpm test:performance --summarize || true

      - name: Report (full differential conformance)
        run: |
          pnpm --filter @hozo/compiler build:native:release
          node packages/test-reporter/src/run-command-junit.mjs conformance pnpm turbo run report --summarize -- --check || true

      - name: Report (optional & cross-platform CI workflows)
        run: node packages/test-reporter/src/workflows-to-junit.mjs || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch previous Allure history
        run: |
          mkdir -p allure-history
          curl -fsSL https://iray-tno.github.io/hozo/reports/history/allure-history.jsonl -o allure-history/allure-history.jsonl || rm -f allure-history/allure-history.jsonl

      - name: Add source links to Allure results
        run: node packages/test-reporter/src/junit-to-allure.mjs

      - name: Build Allure HTML reports
        run: pnpm --filter @hozo/test-reporter exec allure generate --cwd "$GITHUB_WORKSPACE" -o "$GITHUB_WORKSPACE/apps/landing/dist/reports" "$GITHUB_WORKSPACE/allure-results" || true

      - name: Persist Allure history
        run: |
          mkdir -p apps/landing/dist/reports/history
          cp -f allure-history/allure-history.jsonl apps/landing/dist/reports/history/allure-history.jsonl || true

      - name: Brand Allure report head
        run: node packages/test-reporter/src/brand-report.mjs apps/landing/dist/reports/index.html || true

      - name: Ensure .nojekyll exists
        run: touch apps/landing/dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Report first, then make regressions visible on main. Every producer
      # above writes JUnit even when its command fails, so this step can fail
      # the workflow without preventing the diagnostic page from deploying.
      - name: Assert reported checks passed
        run: node packages/test-reporter/src/assert-junit.mjs
