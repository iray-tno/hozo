name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'examples/storybook-demo/**'
      - '.github/workflows/deploy-pages.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm --filter @hozo/landing build
      - run: pnpm --filter @hozo/example-storybook build

      - name: Integrate Storybook into Landing Dist
        run: |
          mkdir -p apps/landing/dist/storybook
          cp -r examples/storybook-demo/storybook-static/* apps/landing/dist/storybook/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
