name: owner-evidence
on:
  pull_request:
    paths:
      - 'scripts/style-slots/handle-*.mjs'
      - 'scripts/style-slots/tabs-probe.mjs'
      - 'scripts/style-slots/tabs-web-publication.mjs'
      - 'scripts/style-slots/web-owner-publication.mjs'
      - 'scripts/style-slots/vite-owner-publication.mjs'
      - 'packages/vite/src/**'
      - 'packages/metro/src/**'
      - 'examples/native-demo/scripts/metro-partial-owner-bundle.test.mjs'
      - 'crates/hozo_parser/src/static_imports.rs'
      - 'crates/hozo_napi/src/static_imports.rs'
      - 'scripts/style-slots/tabs-owner-shadow.mjs'
      - 'scripts/style-slots/owner-fixture.mjs'
      - 'scripts/style-slots/owner-input-cases.mjs'
      - 'scripts/style-slots/owner-input-audit.mjs'
      - 'scripts/style-slots/tabs-contract-audit.mjs'
      - 'scripts/style-slots/handle-contract-assessment.mjs'
      - 'scripts/style-slots/status.mjs'
      - 'scripts/style-slots/scoped-denominators.mjs'
      - 'scripts/style-slots/status-summary.mjs'
      - 'scripts/style-slots/vite-evidence.mjs'
      - 'scripts/style-slots/metro-bundle-evidence.mjs'
      - 'scripts/style-slots-status.test.mjs'
      - 'scripts/style-slots/owner-shadow.json'
      - 'scripts/style-slots/catalog.mjs'
      - 'examples/storybook-demo/scripts/owner-handle.test.mjs'
      - 'examples/storybook-demo/scripts/owner-tabs.test.mjs'
      - 'examples/storybook-demo/scripts/owner-toolbar.test.mjs'
      - 'examples/storybook-demo/scripts/owner-vite.test.mjs'
      - 'packages/tailwind-conformance/src/tabs-owner-state.test.ts'
      - 'packages/tailwind-conformance/src/toolbar-owner.test.ts'
      - 'packages/tailwind-conformance/src/tabs-prepared-owner.test.ts'
      - 'packages/tailwind-conformance/src/tabs-compiled-owner.test.ts'
      - 'packages/tailwind-conformance/src/text-child-containers.test.ts'
      - 'packages/behaviors/src/text-child.native.tsx'
      - 'packages/tailwind-conformance/src/bottom-sheet-prepared-handle.test.ts'
      - 'packages/tailwind-conformance/src/owner-bundle.test.ts'
      - 'packages/compiler/src/owner-*.ts'
      - 'crates/hozo_native/src/owner_style.rs'
      - 'crates/hozo_web/src/owner_class.rs'
      - 'crates/hozo_web/src/lib.rs'
      - 'crates/hozo_native/src/conditions/guards.rs'
      - 'crates/hozo_native/src/render.rs'
      - 'crates/hozo_napi/src/lib.rs'
      - 'crates/hozo_napi/src/prepared_module.rs'
      - 'packages/patterns/src/bottom-sheet*'
      - 'packages/patterns/src/tabs*'
      - 'packages/patterns/src/toolbar*'
      - '.github/workflows/owner-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      GOMAXPROCS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      # Native component probes import Metro's source transform, not an app build.
      - run: pnpm exec turbo run build --filter='@hozo/example-storybook^...' --filter='@hozo/metro' --concurrency=2
      - run: node --test --test-concurrency=1 examples/storybook-demo/scripts/owner-handle.test.mjs
      - run: node --test --test-concurrency=1 packages/tailwind-conformance/src/bottom-sheet-prepared-handle.test.ts packages/tailwind-conformance/src/text-child-containers.test.ts
      - run: node --test --test-concurrency=1 packages/tailwind-conformance/src/tabs-owner-state.test.ts packages/tailwind-conformance/src/tabs-prepared-owner.test.ts packages/tailwind-conformance/src/tabs-compiled-owner.test.ts examples/storybook-demo/scripts/owner-tabs.test.mjs
      - run: node --test --test-concurrency=1 packages/tailwind-conformance/src/toolbar-owner.test.ts
      - run: node --test --test-concurrency=1 examples/storybook-demo/scripts/owner-toolbar.test.mjs
      - run: node --test --test-concurrency=1 examples/storybook-demo/scripts/owner-vite.test.mjs
      - run: node --test --test-concurrency=1 examples/native-demo/scripts/metro-partial-owner-bundle.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metro-partial-owner-bundle
          path: artifacts/style-fact-model/metro-partial-owner-bundle.json
          if-no-files-found: warn
      - run: node --test --test-concurrency=1 packages/tailwind-conformance/src/owner-bundle.test.ts
      # Read real receipts from this checkout; a missing/stale probe fails the
      # bounded audit rather than quietly inheriting a previous green report.
      - run: node scripts/style-slots/owner-input-audit.mjs --output artifacts/style-fact-model/owner-input-audit.json
        if: always()
      - run: node scripts/style-slots/tabs-contract-audit.mjs
        if: always()
      - run: node scripts/style-slots/handle-contract-assessment.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handle-contract-assessment
          path: artifacts/style-fact-model/handle-contract-assessment.json
          if-no-files-found: error
      - run: >-
          node scripts/style-slots/status.mjs
          --output artifacts/style-fact-model/styling-fact-status.json
          artifacts/style-fact-model/tabs-contract-audit.json
          artifacts/style-fact-model/handle-contract-assessment.json
          artifacts/style-fact-model/handle-bundle.json
          artifacts/style-fact-model/vite-owner-browser.json
          artifacts/style-fact-model/vite-owner-fallback-browser.json
          artifacts/style-fact-model/metro-partial-owner-bundle.json
        if: always()
      - name: Summarize scoped styling evidence
        if: always()
        run: node scripts/style-slots/status-summary.mjs artifacts/style-fact-model/styling-fact-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styling-fact-status
          path: artifacts/style-fact-model/styling-fact-status.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabs-contract-audit
          path: artifacts/style-fact-model/tabs-contract-audit.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-input-audit
          path: artifacts/style-fact-model/owner-input-audit.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-handle-browser-evidence
          path: |
            artifacts/style-fact-model/handle-browser.json
            artifacts/style-fact-model/handle-browser-lifetime.json
            artifacts/style-fact-model/handle-inputs-native.json
            artifacts/style-fact-model/handle-states-native.json
            artifacts/style-fact-model/handle-inputs-browser.json
            artifacts/style-fact-model/handle-bundle.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-vite-evidence
          path: artifacts/style-fact-model/vite-owner-browser.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-vite-fallback-evidence
          path: artifacts/style-fact-model/vite-owner-fallback-browser.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-tabs-evidence
          path: |
            artifacts/style-fact-model/tabs-browser.json
            artifacts/style-fact-model/tabs-native.json
            artifacts/style-fact-model/tabs-compiled-native.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-toolbar-evidence
          path: |
            artifacts/style-fact-model/toolbar-native.json
            artifacts/style-fact-model/toolbar-browser.json
          if-no-files-found: warn
