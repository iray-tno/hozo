# Does Hozo's Native output actually run?
#
# Nothing else in this repository answers that. `ci.yml`'s `test` and
# `platform-compat` render every native tree against a stub this project
# wrote, which can only confirm that Hozo agrees with itself --
# `react-native-stub.js` says so in its own header. `examples/native-demo`
# bundles through a real Metro, so the transform is covered; the runtime is
# not covered at all.
#
# The Web side closed this hole already. `apps/landing/scripts/check-repl.mjs`
# starts headless Chrome because "a real browser is the only thing that can
# say whether a thing a browser has to do works". This is that sentence for
# the other platform. See #297.
#
# Weekly and on demand, not per pull request and not per merge to main. The
# question is "does it still boot", which moves slowly, and the run is tens
# of minutes. A paths filter was considered and rejected: the Native output
# depends on `hozo_ir`, `hozo_parser` and the shared lowering as much as on
# `hozo_native`, so an honest filter is most of the repository. `dispatch`
# covers the moment it matters most, which is before a release (#8).
#
# Two platforms, because they are two runtimes rather than one output run
# twice: different renderer, different text metrics, and an accessibility
# API with a different vocabulary. Both jobs read the accessibility tree,
# which is where every defect this workflow has found came from rather than
# from the boot -- Android through `uiautomator dump`, which needs nothing
# installed, and iOS through an XCUITest target, because `uiautomator` has
# no equivalent there. The iOS job also establishes the half the Android
# one cannot: that Hozo's output survives CocoaPods, Hermes and the Xcode
# script phase that runs Metro.
#
# Neither job costs money. This repository is public and both runners are
# standard GitHub-hosted ones, which are free for public repositories --
# the ten-to-one multiplier that used to be written here applies to billed
# minutes, which these are not. What the iOS job does spend is a scarce
# concurrent macOS slot for twenty-odd minutes, and the wall-clock time of
# anyone waiting on it.
#
# So the schedule stands on the reason above it rather than on that one:
# "does it still boot" moves slowly, and a run is tens of minutes.
name: native

on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:
  # A pull request that edits this machinery runs it. Narrowly the wrong
  # shape -- the rest of the reasoning above rejects paths filters -- and
  # deliberately so, because these two paths are not a guess about what
  # might break the app: they are the app and the job that boots it. It is
  # also the only way to see this workflow work before it is on the default
  # branch, since `workflow_dispatch` cannot reach a file that is not there
  # yet.
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - 'examples/native-demo/**'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      # Gradle runs Metro to bake the bundle into the release APK, Metro runs
      # `@hozo/metro`'s transformer, and that transformer is the compiler. No
      # addon, no bundle.
      - run: pnpm --filter @hozo/compiler build:native
      # And the whole workspace, because `metro.config.js` imports
      # `@hozo/metro/config`, whose `exports` map points at `dist/`. The
      # addon alone leaves that unbuilt, and Metro's failure is a missing
      # file rather than anything naming Hozo. `ci.yml` gets this for free:
      # its `pnpm test` goes through turbo, which builds first.
      - run: pnpm turbo run build

      # One ABI. The committed `gradle.properties` lists four because a real
      # device needs them; the emulator here is x86_64 and building the other
      # three is three quarters of the time for nothing.
      - name: Build the release APK
        working-directory: examples/native-demo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      # The emulator needs hardware acceleration to be usable, and the
      # runner's KVM device is not world-accessible by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot it, and fail if it did not come up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # `-no-snapshot-*` because the log says the emulator was saving a
          # `default_boot` snapshot on every shutdown and restoring it on
          # the next run -- and the only run that ever read the
          # accessibility tree was the first one, before a snapshot
          # existed. Every run since has started from a restored image and
          # uiautomator has never found an idle window on one, while the
          # frame counters say nothing is drawing. A hypothesis rather than
          # a diagnosis: it fits both facts and no other explanation fits
          # either, and one run settles it.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-snapshot-load
          script: bash examples/native-demo/scripts/android-smoke.sh

      # The comparison, against the tree that came off the emulator a
      # moment ago rather than against the checked-in one. Same functions
      # as `native-tree.test.ts` runs offline: two comparisons that agree
      # today and drift tomorrow is the failure this repository keeps
      # finding, so there is one and two callers.
      #
      # Until this step existed the dump was collected, uploaded and never
      # read, so a platform regression -- React Native choosing a different
      # widget, an OS release dropping a trait -- would have waited for
      # somebody to refresh a fixture by hand.
      - name: Check the tree against what the compiler emitted
        run: |
          node --experimental-strip-types \
            packages/tailwind-conformance/src/native-tree-check.ts \
            --platform android \
            --tree window_dump.xml \
            --source examples/native-demo/App.tsx

      # Whatever the run learned, kept. On a failure the log is the whole
      # story, and on a success the three trees -- at rest, with the dialog
      # open, and after dismissing it -- are what
      # `packages/tailwind-conformance/src/native-tree.ts` reads offline.
      - name: Keep what it saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot
          path: |
            window_dump.xml
            *-failed.png
            dialog_dump.xml
            dismissed_dump.xml
            gallery_dump.xml
            gallery.png
            examples/native-demo/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      # The same two reasons as the Android job: Xcode's "Bundle React
      # Native code and images" phase runs Metro, Metro runs
      # `@hozo/metro`'s transformer, and that transformer is the compiler.
      # No addon, no bundle -- and `metro.config.js` imports
      # `@hozo/metro/config`, whose `exports` map points at `dist/`.
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm turbo run build

      # The decoder the smoke test judges the screen with, checked before
      # it is trusted: a decoder that mis-reads a blank screen reports
      # noise, and noise passes.
      - run: node scripts/screen-colours.test.mjs
        working-directory: examples/native-demo

      # Twice, because CocoaPods fails here intermittently and the failure
      # is inside its own Ruby:
      #
      #     ArgumentError - pathname contains null byte
      #     cocoapods/project.rb:452:in `realdirpath`
      #
      # Two runs in five so far, and CocoaPods' own error report names it
      # as a known one for pnpm monorepos. Nothing in this repository
      # produces the null byte and nothing here can stop it, so the honest
      # options were a retry or a red job every other week.
      #
      # A retry that hides a real failure would be worse than the flake.
      # This one does not: a deterministic failure fails both times and is
      # reported, and the first failure is printed rather than swallowed,
      # so the log still says how often it happens.
      - name: Install the pods
        working-directory: examples/native-demo/ios
        run: |
          pod install && exit 0
          echo "::warning::pod install failed once; retrying -- see the note in native.yml"
          pod install

      # `-derivedDataPath` so the app lands somewhere the smoke script can
      # name, rather than under a hashed directory in ~/Library.
      # Simulator builds need no signing, and saying so is what keeps this
      # from asking for a team.
      - name: Build for the simulator
        working-directory: examples/native-demo/ios
        run: |
          xcodebuild \
            -workspace HozoNativeDemo.xcworkspace \
            -scheme HozoNativeDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot it, and fail if it did not come up
        run: bash examples/native-demo/scripts/ios-smoke.sh

      # The tree, which is what the Android job is actually valuable for
      # and what this one could not read until now. Release, because a
      # Debug build does not bake the JavaScript bundle -- the Xcode phase
      # skips it -- so the app would come up looking for a Metro server
      # that is not there.
      #
      # The simulator `ios-smoke.sh` booted is reused: `xcodebuild` takes
      # the one that is already up rather than starting a second.
      - name: Read the accessibility tree
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace examples/native-demo/ios/HozoNativeDemo.xcworkspace \
            -scheme HozoNativeDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${IOS_DEVICE_NAME:-iPhone 16}" \
            -derivedDataPath examples/native-demo/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            | tee ios-uitest.log
          node examples/native-demo/scripts/extract-trees.mjs ios-uitest.log

      # The same comparison as the Android job runs, through the other
      # adapter. See that step for why it is here rather than only offline.
      - name: Check the tree against what the compiler emitted
        run: |
          node --experimental-strip-types \
            packages/tailwind-conformance/src/native-tree-check.ts \
            --platform ios \
            --tree ios-acceptance-tree.json \
            --source examples/native-demo/App.tsx

      - name: Keep what it saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-boot
          path: |
            ios-screen.png
            ios-app.log
            ios-uitest.log
            ios-acceptance-tree.json
            ios-gallery-tree.json
          if-no-files-found: ignore
          retention-days: 14
