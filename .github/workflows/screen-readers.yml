# Real screen readers reading the Storybook patterns: NVDA with Chrome on
# Windows, VoiceOver with Safari on macOS, driven by Guidepup.
#
# Weekly and on demand, like native.yml, and not per pull request: a run is a
# full Storybook build plus a headed browser and a screen reader walking each
# story on a real desktop, and a screen reader is not deterministic enough to
# gate every change on. The per-PR check is the virtual screen reader in
# examples/storybook-demo. This one also runs on a pull request that changes
# the harness itself, since that is the only way to see a change to it work
# before it is on main.
#
# What each reader said and a screen recording are uploaded as artifacts,
# kept for 14 days and never committed. A person approves a story by copying
# the phrases that must be said into examples/screen-readers/expected/.
name: screen-readers

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/screen-readers.yml'
      - 'examples/screen-readers/**'

permissions:
  contents: read

concurrency:
  group: screen-readers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read:
    name: ${{ matrix.reader }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - reader: nvda
            os: windows-2025
            browser: chromium
          - reader: voiceover
            os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'

      # The catalogue the readers read, built the way the Storybook example's
      # own checks build it.
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm turbo run build --filter=@hozo/example-storybook^...
      # Through pnpm, which puts the example's `storybook` binary on PATH;
      # run with plain `node` the build script cannot find it.
      - run: pnpm exec node scripts/build.mjs storybook-static-check
        working-directory: examples/storybook-demo

      # Permissions for automation (and, on macOS, screen recording), then
      # the screen reader itself: a portable NVDA on Windows.
      #
      # Without `--ci`, and that is a workaround rather than a preference.
      # The flag does two things: it makes a failed TCC database write fatal,
      # and it enables "Do not disturb" -- and the second is what fails. On
      # macOS 13 and newer the only implementation Guidepup has drives Control
      # Center through `tell application "System Events"`, which needs
      # Automation permission granted to whichever process TCC holds
      # responsible for the call. Guidepup pre-writes those grants for a fixed
      # list of client paths, and on some runners the responsible process is
      # not one of them: one run failed all fifteen attempts (three here times
      # five inside Guidepup) with "Not authorized to send Apple events to
      # System Events", and the same commit passed on another machine with the
      # identical image. Nothing this job needs is lost -- notifications do not
      # interrupt a headless runner. See #454.
      #
      # Dropping the flag also stops a failed TCC write from failing the step,
      # which is the one thing `--ci` was buying here. `verify` does that
      # instead, and asks the environment the question the tests care about
      # rather than trusting a command that exits 0 either way.
      - shell: bash
        run: |
          verify() {
            [ "$RUNNER_OS" = macOS ] || return 0
            # VoiceOver's own AppleScript switch, which `setup` writes.
            [ "$(defaults read com.apple.VoiceOver4/default SCREnableAppleScript 2>/dev/null)" = 1 ] \
              || { echo 'SCREnableAppleScript is not 1'; return 1; }
            # The marker file VoiceOver reads to accept AppleScript at all.
            # Guidepup can only write it while SIP is off, which it is on
            # GitHub's images -- said rather than assumed, because a runner
            # image that turns SIP back on would fail here for a reason worth
            # naming.
            if ! csrutil status | grep -q disabled; then
              echo 'note: SIP is enabled, so the VoiceOver AppleScript marker cannot be written'
            elif [ ! -f /private/var/db/Accessibility/.VoiceOverAppleScriptEnabled ]; then
              echo 'the VoiceOver AppleScript marker file is missing'
              return 1
            fi
            # And the permission itself, asked for directly. This is what the
            # reader needs; a grant in the database that TCC does not apply to
            # this process tree would pass every check above and fail here.
            osascript -e 'tell application "System Events" to count processes' > /dev/null \
              || { echo 'osascript cannot drive System Events'; return 1; }
          }
          for attempt in 1 2 3; do
            if npx -y @guidepup/setup@0.25.3 setup --macos-record; then
              verify && exit 0
            else
              echo "setup attempt $attempt exited non-zero"
            fi
            echo "setup attempt $attempt did not leave a usable environment; retrying"
            sleep 10
          done
          exit 1
      # From the harness package: `install` resolves `@guidepup/guidepup` from
      # the working directory to pick the matching screen reader build, and
      # only examples/screen-readers depends on it.
      - run: npx -y @guidepup/setup@0.25.3 install
        working-directory: examples/screen-readers
      - run: pnpm exec playwright install ${{ matrix.browser }}
        working-directory: examples/screen-readers

      # The Windows recorder calls ffmpeg-static, whose binary is fetched by
      # an install script pnpm does not run for dependencies. Fetched here
      # rather than allowed repository-wide, so no other job downloads it.
      - if: matrix.reader == 'nvda'
        shell: bash
        working-directory: examples/screen-readers
        run: |
          dir=$(node -e "const p=require('node:path');console.log(p.dirname(require.resolve('ffmpeg-static/package.json',{paths:[p.dirname(require.resolve('@guidepup/record'))]})))")
          (cd "$dir" && node install.js)

      - run: pnpm run read
        working-directory: examples/screen-readers
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-readers-${{ matrix.reader }}
          path: examples/screen-readers/test-results/
          retention-days: 14
          if-no-files-found: warn
