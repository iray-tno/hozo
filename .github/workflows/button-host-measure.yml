name: button-host-measure
on:
  push:
    branches: [chore/button-host-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native:release
      - run: pnpm exec turbo run build --filter='@hozo/tailwind-conformance...' --concurrency=2
      - name: Record source
        run: |
          mkdir -p artifacts/button-host
          git rev-parse HEAD > artifacts/button-host/source-commit.txt
      - name: Exercise SSR metadata without React hydration
        run: pnpm --filter @hozo/example-storybook exec node --test --test-concurrency=1 --test-name-pattern='Button host IDs and metadata' scripts/candidate-cascade.test.mjs > artifacts/button-host/browser.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-host-evidence
          path: artifacts/button-host
