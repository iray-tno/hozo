name: color-picker-semantics-measure
on:
  push:
    branches: [chore/color-picker-semantics-measure]
permissions:
  contents: read
jobs:
  regression-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm exec turbo run build --filter=@hozo/compiler... --filter=@hozo/primitives... --filter=@hozo/form... --filter=@hozo/patterns... --concurrency=1
      - name: Check radio semantics and existing semantic/broad regressions
        shell: bash
        run: |
          mkdir -p artifacts/color-picker-semantics
          git rev-parse HEAD > artifacts/color-picker-semantics/source.txt
          node --test --test-concurrency=1 --test-name-pattern='ColorPicker semantic classes|Stepper semantic classes|Chip semantic classes|Pagination semantic classes|second batch of Native controls|Native slotted patterns' examples/storybook-demo/scripts/candidate-cascade.test.mjs | tee artifacts/color-picker-semantics/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-picker-semantics
          path: artifacts/color-picker-semantics/
          if-no-files-found: warn
