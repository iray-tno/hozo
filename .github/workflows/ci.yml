# The pull-request gate is deliberately deterministic and bounded:
# - `lint`: static checks (Biome and Clippy).
# - `test`: Rust plus publishable-package behavior on one reference OS.
# - `platform-compat`: the native addon and a compiler smoke suite on macOS/Windows.
#
# Real app bundles, performance tripwires, WASM parity and full differential
# conformance run on main and weekly in deploy-pages.yml. They are still
# visible in Allure and still fail that workflow, without making every PR
# pay for runner-clock noise or repeated integration builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm lint
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm test:packages
      # Every workspace, examples included -- and the examples are the
      # point. `pnpm test:packages` stops at `./packages/*`, so nothing in
      # CI had ever type-checked an app *against* the published entry
      # points. That is precisely where the `react-native` export
      # condition resolving to the Web declarations was visible, and it
      # went unseen for the whole life of the Native backend.
      - run: pnpm typecheck
      # A real Astro build, and the assertions about what came out of it.
      # `apps/landing` is the only place a `.mdx` is compiled end to end
      # -- through `@astrojs/mdx`, which hands Hozo `_jsx()` calls rather
      # than JSX -- and nothing in CI had ever run it. `test:build` rather
      # than `test`: the REPL check drives headless Chrome against a
      # WebAssembly build this job does not have, and belongs where that
      # build already happens (`deploy-pages.yml`).
      - run: pnpm --filter @hozo/landing run test:build
      # Ten thousand rows in a real browser. The Web `FlatList`'s windowing
      # is a claim about layout -- how many rows are mounted, where the
      # scroll lands, which row is at the top -- and jsdom has no layout, so
      # an implementation that mounted every row would pass `pnpm
      # test:packages` unchanged.
      - run: pnpm --filter @hozo/runtime run test:browser

  platform-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm --filter @hozo/compiler build
      - run: pnpm --filter @hozo/compiler test:platform
