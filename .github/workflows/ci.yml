# Everything that has to pass on every push, split by feedback speed and responsibility:
# - `lint`: Fast static checks (Biome & Clippy) on Ubuntu in ~25s.
# - `test`: Full suite (Rust & 25 JS packages including StyleX conformance) on Ubuntu.
# - `platform-compat`: Native addon build & OS verification on macOS and Windows.
# - `conformance`: Full Tailwind & StyleX differential conformance audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm test

  platform-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm test

  conformance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hozo/compiler build:native:release
      - run: pnpm turbo run report -- --check
