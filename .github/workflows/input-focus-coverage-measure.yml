name: input-focus-coverage-measure

# One-off measurement branch only. This file is not part of the feature PR.
on:
  push:
    branches: [chore/input-focus-coverage-measure]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native:release
      - run: pnpm exec turbo run build --filter='@hozo/tailwind-conformance...' --concurrency=2
      - name: Generate an explicitly unvalidated snapshot artifact for review
        run: |
          mkdir -p artifacts/input-focus-measure
          git rev-parse HEAD > artifacts/input-focus-measure/source-commit.txt
          # The production CI guard rightly refuses a snapshot write. This
          # isolated branch is a data-generation task, NOT a validation gate.
          # Only this writer omits CI; normal --check workflows are unchanged.
          env -u CI pnpm --filter @hozo/tailwind-conformance report > artifacts/input-focus-measure/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-focus-conformance-measure
          path: |
            artifacts/input-focus-measure
            packages/tailwind-conformance/snapshot.json
