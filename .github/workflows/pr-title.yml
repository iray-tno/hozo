# The pull request title becomes the subject line on main, and several agents
# open pull requests here. This holds them to one convention (AGENTS.md).
# `edited` is in the trigger list so that fixing the title re-runs the check.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      # The title goes through the environment, never interpolated into the
      # script, so a title cannot inject shell.
      - run: node scripts/check-pr-title.mjs "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
