name: semantic-slots-rebase-measure
on:
  push:
    branches: [chore/semantic-slots-rebase-measure]
permissions:
  contents: read
jobs:
  regression-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@hozo/test-reporter'
      - run: pnpm --filter @hozo/compiler build:native
      - run: pnpm exec turbo run build --filter=@hozo/compiler... --filter=@hozo/primitives... --filter=@hozo/form... --filter=@hozo/patterns... --concurrency=1
      - name: Check the original failure and real Web oracles
        shell: bash
        run: |
          mkdir -p artifacts/semantic-slots-rebase
          git rev-parse HEAD > artifacts/semantic-slots-rebase/source.txt
          node --test --test-concurrency=1 --test-name-pattern='second batch of Native controls|Chip semantic classes|Pagination semantic classes' examples/storybook-demo/scripts/candidate-cascade.test.mjs | tee artifacts/semantic-slots-rebase/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-slots-rebase
          path: artifacts/semantic-slots-rebase/
          if-no-files-found: warn
