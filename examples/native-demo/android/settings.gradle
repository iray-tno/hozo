// Where React Native's build-time packages actually are, asked rather than
// assumed.
//
// The stock template assumes a flat `node_modules` in three separate
// places: this file writes
// `includeBuild("../node_modules/@react-native/gradle-plugin")`,
// `app/build.gradle` documents `../../node_modules/@react-native/codegen`
// as its `codegenDir` default, and the Gradle plugin looks for hermesc at
// `node_modules/hermes-compiler/hermesc/%OS-BIN%/` under the app. All three
// are right for npm and none of them exists here.
//
// This is a pnpm workspace, and all three packages are *transitive*
// dependencies of `react-native`: pnpm gives a package only what it
// declared, so they live under `node_modules/.pnpm/` and the app's own
// `node_modules/@react-native/` holds nothing but `metro-babel-transformer`
// and `metro-config`.
//
// Three occurrences of one problem is why this is a helper rather than
// three inline lookups, and why each was found one CI run at a time: the
// build fails at the first, and only then reaches the second.
//
// Gradle's failure for the first one names the missing directory and
// mentions neither pnpm nor React Native, which is a bad half-hour for
// anyone who meets it. `ios/Podfile` already avoids the identical
// assumption -- it asks node to `require.resolve` the Ruby file rather than
// spelling a path -- so this is the same answer on the other platform.
// Resolved *through* `react-native` rather than from the app, because that
// is the real relationship.
//
// All of it inside `pluginManagement`, and the answers parked on
// `gradle.ext` for `build.gradle` to read. Not a stylistic choice: a
// settings script must open with `pluginManagement {}` before any other
// statement, so there is nowhere above it to put a helper and no way to
// `apply from:` one. `gradle.ext` is the one scope a settings script and a
// project script share, which makes it the only way to resolve this once.
//
// `providers.exec` rather than Groovy's `"…".execute()`: the value is read
// at configuration time, and the configuration cache has to be able to see
// where it came from.

pluginManagement {
    def resolveThroughReactNative = { String specifier ->
        providers.exec {
            workingDir = rootDir
            commandLine "node", "--print",
                "(() => { const path = require('node:path');" +
                " const app = path.resolve('..');" +
                " const rn = require.resolve('react-native/package.json', { paths: [app] });" +
                " return path.dirname(require.resolve('${specifier}/package.json'," +
                " { paths: [path.dirname(rn)] })); })()"
        }.standardOutput.asText.get().trim()
    }

    gradle.ext.reactNativeGradlePluginDir = resolveThroughReactNative("@react-native/gradle-plugin")
    gradle.ext.reactNativeCodegenDir = resolveThroughReactNative("@react-native/codegen")
    // The third of these, and the reason the helper exists rather than
    // three inline copies. React Native 0.87 stopped shipping prebuilt
    // hermesc inside its own package and takes it from `hermes-compiler`
    // instead, which the plugin looks for at
    // `node_modules/hermes-compiler/hermesc/%OS-BIN%/` under the app.
    gradle.ext.hermesCompilerDir = resolveThroughReactNative("hermes-compiler")

    includeBuild(gradle.ext.reactNativeGradlePluginDir)
}

plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'HozoNativeDemo'
include ':app'
includeBuild(gradle.ext.reactNativeGradlePluginDir)
