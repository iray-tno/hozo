// Where React Native's build-time packages actually are, asked rather than
// assumed.
//
// The stock template spells these out as paths -- `settings.gradle` writes
// `../node_modules/@react-native/gradle-plugin`, and `app/build.gradle`
// documents `../../node_modules/@react-native/codegen` as its default.
// Both are correct for npm's flat `node_modules` and neither exists here.
// This is a pnpm workspace, and both packages are *transitive* dependencies
// of `react-native`: pnpm gives a package only what it declared, so these
// live under `node_modules/.pnpm/` and the app's own `node_modules` has
// nothing but `metro-babel-transformer` and `metro-config` in that scope.
//
// Gradle's failure for the first one names the missing directory and
// mentions neither pnpm nor React Native, which is a bad half-hour for
// anyone who meets it. `ios/Podfile` already avoids the identical
// assumption -- it asks node to `require.resolve` the Ruby file rather than
// spelling a path -- so this is the same answer on the other platform.
//
// Applied twice, from `settings.gradle` and from `build.gradle`: a settings
// script and a project script cannot share `ext`, and the ordering means
// the first needs its answer before the second exists. One file rather than
// two copies of the closure, which is the part that would have drifted.
//
// Resolved *through* `react-native` rather than from the app, because that
// is the real relationship. `providers.exec` rather than Groovy's
// `"…".execute()`: the value is read at configuration time, and the
// configuration cache has to be able to see where it came from.

def resolveThroughReactNative = { String specifier ->
    providers.exec {
        workingDir = rootDir
        commandLine "node", "--print",
            "(() => { const path = require('node:path');" +
            " const app = path.resolve('..');" +
            " const rn = require.resolve('react-native/package.json', { paths: [app] });" +
            " return path.dirname(require.resolve('${specifier}/package.json'," +
            " { paths: [path.dirname(rn)] })); })()"
    }.standardOutput.asText.get().trim()
}

ext.reactNativeGradlePluginDir = resolveThroughReactNative("@react-native/gradle-plugin")
ext.reactNativeCodegenDir = resolveThroughReactNative("@react-native/codegen")
