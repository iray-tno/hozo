[package]
name = "hozo_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly binding exposing the Hozo compiler to a browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hozo_ir = { path = "../hozo_ir" }
hozo_native = { version = "0.0.0", path = "../hozo_native" }
hozo_parser = { path = "../hozo_parser" }
hozo_web = { path = "../hozo_web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.126"
