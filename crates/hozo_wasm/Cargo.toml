[package]
name = "hozo_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Not a crate anyone depends on: the compiler built for the landing page's
# REPL, fetched as a `.wasm` file.
publish = false
description = "WebAssembly binding exposing the Hozo compiler to a browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hozo_ir.workspace = true
hozo_native.workspace = true
hozo_parser.workspace = true
hozo_web.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.126"
