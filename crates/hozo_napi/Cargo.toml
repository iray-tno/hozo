[package]
name = "hozo_napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Not a crate anyone depends on: a Node addon, delivered as `@hozo/compiler`
# and its per-platform packages on npm.
publish = false
description = "Node native binding exposing the Hozo compiler to JS build tooling."

[lib]
crate-type = ["cdylib"]

[dependencies]
hozo_cache.workspace = true
hozo_ir.workspace = true
hozo_native.workspace = true
hozo_parser.workspace = true
hozo_web.workspace = true
napi = "3.12.1"
napi-derive = "3.6.3"

[build-dependencies]
napi-build = "2.4.1"
